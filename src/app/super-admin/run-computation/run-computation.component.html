<app-menue></app-menue>

<br />

<div class="container">
  <div class="card">
    <div class="card-header text-white bg-success mb-3">Run Computation</div>

    <entity-program-selecter></entity-program-selecter>

    <div #spinnerDiv class="form-group col-md-3">
      <progress-spinner></progress-spinner>
    </div>

    <div class="container">
      <div class="form-row">
        <div class="form-group col-md-2">
          <button
            type="button"
            class="btn btn-success"
            (click)="runComputation()"
          >
            Submit
          </button>
        </div>
        <div class="form-group col-md-2">
          <button
            type="button"
            class="btn btn-success"
            (click)="runComputationALL()"
          >
            Compute ALL
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
