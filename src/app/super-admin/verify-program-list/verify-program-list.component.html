<app-menue></app-menue>
<div class="container"> 
        <div class="form-row"><p><b>Verify Program List</b></p></div>
        <div class="form-row">
            <div class="form-group col-md-2">
                <label for="Program">Program</label>
            </div>
            <div class="form-group col-md-4">
                <select  required   ngModel name = "Program" class="form-control" style="width:200px;"  (change)="ProgramListChange(Program.viewModel)" #Program="ngModel" [(ngModel)]= "courseObject.program_id">
                    <option selected value="0">Please Select Program</option>
                    <option *ngFor="let Program of programList" value ="{{Program.program_id}}"> {{Program.program_name}}</option>
               </select>
            <div class="alert alert-danger" *ngIf="Program.touched &&  !Program.valid">Valid Program is required</div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group col-md-2">
                <label for="ListNo">List Number</label>
            </div>
            <div class="form-group col-md-4">
                 <select required  ngModel name="ListNo" class="form-control" style="width:200px;" (change)="ListNumChange($event)" #ListNo="ngModel" [(ngModel)]="listNum">
                    <option selected value="0">Please Select List Number</option>
                    <option *ngFor="let num of numlist" value="{{num}}">{{ num }}</option>
                </select>
            <!--<div class="alert alert-danger" *ngIf="ListNo.touched &&  !ListNo.valid">Valid List Number is required</div> -->
            </div>
        </div>
        <div class="form-row">
                <button type="button" class="btn btn-success mr-2 btn-sm" type="submit" (click)="getdata()"> Get Program List </button>
        </div>
        <br>
        <div *ngIf="showNoDatalbl"> <p>No data found</p></div>
        <div *ngIf="!showNoDatalbl && courseListGrid.length > 0" class="container border">
            <label><b>Total : {{totCount}}</b></label> &nbsp; &nbsp; &nbsp;
            <label style="color:red"><b>Pending: {{pendingCount}}</b></label> &nbsp; &nbsp; &nbsp;
            <label style="color:green"><b>Verified: {{verCount}}</b></label>&nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp;
            <button *ngIf="showConfirmbutton" type="button" id="dtlButton" class="btn btn-primary btn-primary-spacing  btn-sm " (click) = "confrimVer()" >Confirm Verification</button>
            <label *ngIf="vfyStatus.length > 0" >List Status: <b style="color:green"><u>{{vfyStatus}}</u></b></label>&nbsp;
            <label *ngIf="vfyUser.length > 0" >By: <b><u>{{vfyUser}}</u></b></label>&nbsp;
            <label *ngIf="vfyDate.length > 0" >On: <b><u>{{vfyDate}}</u></b></label>
            <div style="height: 100%; display: flex; flex-direction: column" >
                <ag-grid-angular
                    #agGrid
                    style="width: 100%; height: 200px"
                    class="ag-theme-alpine"
                    [gridOptions]="gridOptions"
                    (rowSelected)="onRowSelected($event)"
                    [defaultColDef]="defaultColDef"
                    rowSelection="multiple"
                    (gridReady)="OnCoursegridReady($event)">
                </ag-grid-angular>
            </div> 
        </div>
</div>
