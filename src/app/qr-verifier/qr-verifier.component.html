<app-menue></app-menue>
<br>

<div class="container">
  <div class="card">
    <div class="card-header text-white bg-success mb-3">
      QR Verification
    </div>

    <!-- Program Selector -->
    <div class="container mt-2">
      <div class="form-row">
        <div class="form-group col-md-4">
          <label>Select Program</label>
          <select class="form-control" [(ngModel)]="selectedProgram" name="program">
            <option value="">-- Select Program --</option>
            <option *ngFor="let program of programList" [value]="program.programId">
              {{ program.programName }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <!-- Student Info Component -->
    <student-info [myvariable]="selectedProgram" (myOutput)="getStudentData($event)"></student-info>

    <!-- QR Scanner -->
    <div class="container mt-3">

      <div *ngIf="loading">
        <progress-spinner></progress-spinner>
      </div>

      <div class="form-row mt-2">
        <div class="form-group col-md-6">
         <zxing-scanner
  *ngIf="scannerEnabled"
  [device]="currentDevice"
  [enable]="scannerEnabled"
  (camerasFound)="onCamerasFound($event)"
  (scanSuccess)="handleQrCodeResult($event)">
</zxing-scanner>
        </div>

        <div class="form-group col-md-4">
          <button type="button" class="btn btn-success mt-4" (click)="toggleScanner()">
            {{ scannerEnabled ? 'Stop Scanner' : 'Start Scanner' }}
          </button>
        </div>
      </div>

      <div class="form-row mt-3" *ngIf="qrResult">
        <div class="form-group col-md-6">
          <label>QR Result:</label>
          <input type="text" class="form-control" [value]="qrResult" readonly>
        </div>
      </div>

    </div>
  </div>
</div>
